<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Azure To-Do App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0078d4, #5b2cff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #0078d4;
            margin-top: 0;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            background: #0078d4;
            color: white;
            font-size: 15px;
        }

        button:hover {
            background: #005ea6;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 25px;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            margin-bottom: 10px;
            background: #f3f3f3;
            border-radius: 8px;
        }

        li.completed span {
            text-decoration: line-through;
            color: gray;
        }

        .delete {
            background: #d13438;
            padding: 7px 10px;
        }

        .delete:hover {
            background: #a4262c;
        }

        .task {
            cursor: pointer;
            flex: 1;
        }
    </style>
</head>

<body>

<div class="app">
    <h1>🚀 My Azure To-Do</h1>

    <div class="input-area">
        <input id="taskInput" type="text" placeholder="Enter a task...">
        <button onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>
</div>

<script>
    function addTask() {
        const input = document.getElementById("taskInput");
        const task = input.value.trim();

        if (task === "") {
            alert("Please enter a task!");
            return;
        }

        const li = document.createElement("li");

        const span = document.createElement("span");
        span.textContent = task;
        span.className = "task";

        span.onclick = function () {
            li.classList.toggle("completed");
        };

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete";

        deleteButton.onclick = function () {
            li.remove();
        };

        li.appendChild(span);
        li.appendChild(deleteButton);

        document.getElementById("taskList").appendChild(li);

        input.value = "";
        input.focus();
    }

    document.getElementById("taskInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            addTask();
        }
    });
</script>

</body>
</html>
